name: User story
description: An assignable unit of work traced to a requirement
title: "[US-__-___] "
labels: ["story"]
body:
  - type: input
    id: story_id
    attributes:
      label: Story ID
      description: Must exist in docs/backlog/user-stories.md
      placeholder: US-02-003
    validations: {required: true}
  - type: input
    id: requirement
    attributes:
      label: Requirement ID
      description: The FR-xxx / NFR-xxx this discharges. No orphan work.
      placeholder: FR-ING-001
    validations: {required: true}
  - type: input
    id: epic
    attributes:
      label: Epic
      placeholder: EPIC-02
    validations: {required: true}
  - type: textarea
    id: story
    attributes:
      label: Story
      placeholder: As a <persona>, I want <capability> so that <value>.
    validations: {required: true}
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Must be machine-decidable pass/fail.
    validations: {required: true}
  - type: checkboxes
    id: dor
    attributes:
      label: Definition of Ready
      options:
        - label: The requirement has been read (the story is a summary, the FR is binding)
        - label: The epic's phase is the current phase
        - label: Dependencies are complete or explicitly waived
        - label: Any new data source has a resolved licence
