# Prometheus configuration for Phase 1 Local MVP
# Scrapes metrics from API, Dagster, and infrastructure services

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # FastAPI application
  - job_name: 'api'
    static_configs:
      - targets: ['api:8000']
    metrics_path: '/metrics'

  # PostgreSQL exporter (requires postgres_exporter sidecar or external)
  # For Phase 1, we'll use a simple static config if exporter is added
  # - job_name: 'postgres'
  #   static_configs:
  #     - targets: ['postgres-exporter:9187']

  # MinIO
  - job_name: 'minio'
    static_configs:
      - targets: ['minio:9000']
    metrics_path: '/minio/v2/metrics/cluster'

  # Dagster (if metrics endpoint is configured)
  # - job_name: 'dagster'
  #   static_configs:
  #     - targets: ['dagster:3000']
